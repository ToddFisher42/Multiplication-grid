<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A customisable times-table grid for teachers: choose which tables to show, scramble the rows and columns, run a countdown timer, then reveal the answers.">
    <title>Times Table Grid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="theme-switch no-print">
        <label class="switch">
            <input type="checkbox" id="themeToggle" aria-label="Toggle dark mode">
            <span class="slider"></span>
        </label>
    </div>

    <header class="page-header no-print">
        <h1>Times Table Grid</h1>
    </header>

    <div class="controls no-print">
        <section class="control-group">
            <h2>Select Numbers</h2>
            <div id="checkboxes" class="checkboxes"></div>
            <div class="group-select">
                <label><input type="checkbox" class="range-select" data-max="10"> 1&ndash;10</label>
                <label><input type="checkbox" class="range-select" data-max="12"> 1&ndash;12</label>
                <label><input type="checkbox" class="range-select" data-max="15"> Select All</label>
            </div>
        </section>

        <section class="control-group">
            <h2>Timer (minutes)</h2>
            <select id="timerSelect" aria-label="Timer length in minutes">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5" selected>5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="custom">Custom</option>
            </select>
            <input type="number" id="customTime" min="1" max="60" placeholder="Minutes" aria-label="Custom timer length in minutes" style="display: none;">
            <div class="timer-buttons">
                <button id="startBtn" type="button">Start</button>
                <button id="pauseBtn" type="button" disabled>Pause</button>
                <button id="resetBtn" type="button">Reset</button>
                <span id="timerDisplay" class="timer-display" role="timer" aria-live="off" aria-atomic="true">00:00</span>
            </div>
        </section>

        <section class="control-group action-buttons">
            <button id="scrambleBtn" type="button">Scramble</button>
            <button id="toggleAnswersBtn" type="button">Show Answers</button>
            <button id="viewToggleBtn" type="button" aria-pressed="false">List View</button>
        </section>
    </div>

    <p id="status" class="status no-print" role="status" aria-live="polite"></p>

    <div id="grid" class="grid-container"></div>

    <script src="script.js"></script>
</body>
</html>
